services:
  - type: web
    name: wavesmith-backend
    env: docker
    dockerfilePath: ./Dockerfile
    region: oregon
    plan: free
    envVars:
      - key: GOOGLE_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: SOUNDFONT_PATH
        value: soundfonts/default.sf2
